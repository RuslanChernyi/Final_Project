<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 LED Control</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --on: #16a34a;
      --off: #4b5563;
      --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1c212b;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --off: #6b7280;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 24px;
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 2px 12px rgba(0, 0, 0, .08);
    }
    h1 { margin: 0 0 4px; font-size: 1.3rem; }
    .topic { margin: 0 0 20px; color: var(--muted); font-size: .85rem; word-break: break-all; }
    .buttons { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #btn-on  { background: var(--on); }
    #btn-off { background: var(--off); }
    #status { min-height: 1.4em; margin: 16px 0 0; font-size: .9rem; color: var(--muted); }
    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Світлодіод ESP32</h1>
    <p class="topic">iot-course/Ruslan_Chernyi/commands/led</p>

    <div class="buttons">
      <button id="btn-on"  onclick="sendLed('on')">Увімкнути</button>
      <button id="btn-off" onclick="sendLed('off')">Вимкнути</button>
    </div>

    <p id="status"></p>
  </main>

  <script>
    // адреса FastAPI — той самий порт, що й uvicorn
    const API_URL = "http://127.0.0.1:8000";

    const status = document.getElementById("status");
    const buttons = document.querySelectorAll("button");

    async function sendLed(value) {
      buttons.forEach(b => b.disabled = true);   // без подвійних кліків
      status.className = "";
      status.textContent = "Надсилаємо...";

      try {
        const response = await fetch(`${API_URL}/actuators/led`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "set", value: value }),
        });
        const data = await response.json();

        if (!response.ok) {
          // 422 — detail це масив помилок валідації, 502 — рядок від AWS
          const detail = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail);
          throw new Error(`HTTP ${response.status}: ${detail}`);
        }

        // "sent" = брокер прийняв команду; підтвердження від ESP32 приходить у топік events
        status.textContent = `Команду "${value}" надіслано о ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        status.className = "error";
        // TypeError "Failed to fetch" = до сервера не достукались: бекенд не запущений або CORS
        status.textContent = err instanceof TypeError
          ? `Бекенд недоступний (${API_URL}). Чи запущено uvicorn?`
          : err.message;
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    }
  </script>
</body>
</html>
