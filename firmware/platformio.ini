; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; версія платформи запінена — інакше проєкт може перестати збиратися після оновлення
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; два однакові OTA-слоти (app0/app1) замість одного розділу під програму
board_build.partitions = partitions.csv
; після збірки — merged.bin для Wokwi
extra_scripts = post:merge_bin.py

lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
